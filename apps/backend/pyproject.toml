[project]
name = "scoreflow_backend"
version = "0.1.0"
description = "API for scoreflow app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
]
[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.14.10",
]
[tool.pytest.ini_options]
pythonpath = "."
